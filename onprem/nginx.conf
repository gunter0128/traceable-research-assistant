# 地端版的網頁入口（docs/decisions/045）
# 前端檔案、API、檔案上傳都走同一個網址，瀏覽器不會遇到跨網域（CORS）的問題
# 跟公開展示版的 CloudFront 是同一個角色（deploy/cloudfront-distribution.json）
server {
    listen 80;

    # 上傳上限 20 MB（document_service.MAX_UPLOAD_BYTES），多留一點給表單的其他欄位
    client_max_body_size 25m;

    # 前端檔案
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    # API：路徑跟 CloudFront 轉給 Lambda 的一樣
    # 上傳完直接在同一個請求裡處理文件（本機模式），大檔案要等比較久，所以最多等 10 分鐘
    location ~ ^/(auth|workspaces|documents|usage)(/|$) {
        proxy_pass http://api:8000;
        proxy_read_timeout 600s;
    }
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    # 檔案上傳：瀏覽器拿 API 發的上傳許可，直接傳到儲存服務（網址最後的 / 會把 /storage 拿掉再轉過去）
    location /storage/ {
        proxy_pass http://storage:8333/;
    }
}
